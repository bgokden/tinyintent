[project]
name = "tinyintent"
version = "0.1.0"
description = "A small, portable intent classifier: frozen bge-large embeddings, a linear head, and a trained cross-encoder reranker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Berk Gökden" }]
keywords = [
    "intent-classification",
    "intent-detection",
    "text-classification",
    "few-shot",
    "nlp",
    "sentence-transformers",
    "cross-encoder",
    "reranking",
    "embeddings",
    "agent-routing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    # Upper bound: fit() drives the reranker through CrossEncoder.fit(
    # train_dataloader=...), sentence-transformers' deprecated v2 compatibility
    # shim. It survives 3.x-5.x but is not a stable target, so a new major has
    # to be tested before it is allowed in.
    "sentence-transformers>=3.0,<6",
    # Runtime, not dev: IntentModel.fit() always trains the cross-encoder
    # reranker, and on sentence-transformers >=4 that path routes through
    # CrossEncoderTrainer, which needs both of these. Without them the
    # documented quickstart raises ImportError on a clean install.
    "datasets>=2.0",
    "accelerate>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/bgokden/tinyintent"
Repository = "https://github.com/bgokden/tinyintent"
Issues = "https://github.com/bgokden/tinyintent/issues"

[project.scripts]
tinyintent = "tinyintent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyintent"]

[dependency-groups]
# `datasets` deliberately does NOT belong here: it is needed at runtime by
# fit(). Having it dev-only is what let the broken 0.1.0 release pass CI.
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: exercises the real fit() path and downloads models from the HF Hub",
]
